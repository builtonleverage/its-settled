<style>
/* Layout: one phone-width column; sticky flat header, bottom tab bar with a central add button, bottom sheets for every task. */
:root{--bg:#eef1ec;--card:#fbfcfa;--ink:#18201c;--muted:#5f6a63;--faint:#8b958e;--line:#dde3dc;--chip:#e3e8e2;
  --accent:#1f6b55;--accent-ink:#fff;--accent-soft:#d6e9e0;--pos:#1f6b55;--neg:#b0432c;--neg-soft:#f5e1da;--warn:#865b0d;--warn-soft:#f3e8cf;
  --scrim:rgba(8,14,11,.45);--sh:0 1px 2px rgba(20,35,28,.05),0 6px 20px rgba(20,35,28,.06);
  --display:'Bricolage Grotesque',Figtree,system-ui,sans-serif;--body:Figtree,system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1311;--card:#171d1a;--ink:#e9efea;--muted:#a0aca4;--faint:#727d76;--line:#26302b;--chip:#202824;
  --accent:#5cc199;--accent-ink:#0b1712;--accent-soft:#173328;--pos:#6fd0a6;--neg:#f08b70;--neg-soft:#3a201a;--warn:#e2b45a;--warn-soft:#33281a;--scrim:rgba(0,0,0,.6);--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1311;--card:#171d1a;--ink:#e9efea;--muted:#a0aca4;--faint:#727d76;--line:#26302b;--chip:#202824;
  --accent:#5cc199;--accent-ink:#0b1712;--accent-soft:#173328;--pos:#6fd0a6;--neg:#f08b70;--neg-soft:#3a201a;--warn:#e2b45a;--warn-soft:#33281a;--scrim:rgba(0,0,0,.6);--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;min-height:100dvh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(112px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.num{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance}
.muted{color:var(--muted)} .faint{color:var(--faint)} .pos{color:var(--pos)} .neg{color:var(--neg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.top h1{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pill.off{background:var(--warn-soft);color:var(--warn)} .pill.off i{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.hero{padding:20px 18px}
.hero .lbl{font-size:13px;color:var(--muted);font-weight:600}
.hero .big{font-size:40px;font-weight:700;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 2px 8px}
.sec h2{font-size:16px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:18px;font-weight:700;flex:none}
.grow{flex:1;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wrapt{white-space:normal}

.amt .a1{font-weight:600;font-variant-numeric:tabular-nums}
.amt .a2{font-size:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:600;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn.sm{height:34px;padding:0 12px;border-radius:10px;font-size:13px}
.btn.ghost{background:var(--chip);color:var(--ink)}

.btns{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 13px;border-radius:99px;background:var(--chip);font-size:14px;font-weight:500;border:1.5px solid transparent}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chips .div{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 2px 0 6px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.in{width:100%;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px;outline:none}
.in:focus{border-color:var(--accent)}
.in.huge{height:68px;font-size:34px;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:10}
.nav .in-nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:64px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint)}
.nav button.on{color:var(--ink)}
.nav button svg{width:22px;height:22px}
.nav .fab{width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);margin:-26px auto 0;box-shadow:0 6px 18px rgba(31,107,85,.35);justify-content:center}
.nav .fab svg{width:26px;height:26px}
.scrim,.ask{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.ask{z-index:30}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .2s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:20px;font-weight:700;margin-bottom:4px}
@keyframes up{from{transform:translateY(40px);opacity:.4}} @keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px);animation:fade .15s}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.code{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.12em}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:1px}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.land{padding-top:48px}
.logo{font-family:var(--display);font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1}
.logo span{color:var(--accent)}
.lead{font-size:17px;color:var(--muted);margin:10px 0 26px;max-width:32ch}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:13px;padding:4px;margin-bottom:4px}
.tabs button{height:38px;border-radius:10px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.mono{font-variant-numeric:tabular-nums}
.sel{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;max-width:58%}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.switch{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--accent)} .switch:checked::after{transform:translateX(20px)}
.switch:disabled{opacity:.6;cursor:default}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

<body>
<div id="app"></div>
<div id="layer"></div>
<script>
// =====================================================================================
// It's Settled — single-page app. See CLAUDE.md for the architecture and the rules.
// Sections: CONFIG · CORE (shared with server) · HELPERS · STATE & SYNC · SELECTORS ·
//           SCREENS · SHEETS · DIALOGS · EVENTS · DEMO BACKEND · BOOT
// =====================================================================================

// ---------- CONFIG (injected by the Worker; defaults keep the file usable on its own) ----------
/*__CONFIG__*/
const C = Object.assign({ name: "It's Settled", currency: 'INR', locale: 'en-IN', bot: null }, typeof CONFIG !== 'undefined' ? CONFIG : {});
const FORCE_DEMO = false; // the standalone demo build flips this to true
const DEMO = FORCE_DEMO || /^\/demo/.test(location.pathname);
const K = DEMO ? { cache: 'is_demo_cache', q: 'is_demo_q', state: 'is_demo_state' } : { cache: 'is_cache', q: 'is_q', token: 'is_token' };

// ---------- CORE: money math + CSV parsing, inlined from src/core.js ----------
/*__CORE__*/

// ---------- HELPERS ----------
const ls = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NF = [0, 2].map(d => new Intl.NumberFormat(C.locale, { style: 'currency', currency: C.currency, minimumFractionDigits: d, maximumFractionDigits: 2 }));
const fmt = p => NF[p % 100 ? 1 : 0].format(Math.abs(p) / 100);
const SYMBOL = NF[0].formatToParts(0).find(x => x.type === 'currency')?.value || '';
const day = t => new Date(t).toLocaleDateString(C.locale, { day: 'numeric', month: 'short' });
const dayLong = t => new Date(t).toLocaleDateString(C.locale, { weekday: 'short', day: 'numeric', month: 'short' });
const monthKey = t => new Date(t).toLocaleDateString(C.locale, { month: 'long', year: 'numeric' });
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, '').slice(0, 24);
const ord = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
const endOfDay = addDays => { const d = new Date(); d.setHours(23, 59, 59, 999); d.setDate(d.getDate() + addDays); return d.getTime(); };
const waHref = text => 'https://wa.me/?text=' + encodeURIComponent(text);
const loginLink = token => location.origin + '/#login=' + token;
const ICONS = [[/rent/i, '🏠'], [/maid|clean|bai/i, '🧹'], [/cook|chef|tiffin/i, '🍳'], [/wifi|internet|broadband|fiber/i, '📶'],
  [/electric|power|bescom|mgw|current/i, '💡'], [/grocer|milk|egg|veg|fruit|blinkit|zepto|instamart|bigbasket/i, '🛒'], [/mainten|society|repair|plumb/i, '🛠️'],
  [/gas|cylinder|lpg/i, '🔥'], [/water|bisleri/i, '💧'], [/gym/i, '🏋️'], [/dinner|lunch|food|pizza|swiggy|zomato|cafe/i, '🍽️'], [/cab|uber|ola|auto|metro|fuel|petrol/i, '🚕'],
  [/movie|party|outing|trip|game|mystery/i, '🎉']];
const icon = e => e.kind === 'settle' ? '🤝' : (ICONS.find(([r]) => r.test(e.description)) || [0, '🧾'])[1];
const QUICK = ['Groceries', 'Milk', 'Electricity', 'Wifi', 'Gas', 'Water', 'Maid', 'Cook', 'Rent', 'Maintenance', 'Dinner', 'Cab'];
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  bills: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  flat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.5 6-5.5s5.4 2.1 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6.1 4.4 1.9 5 5.4"/></svg>',
  settle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>',
};

// ---------- STATE & SYNC ----------
let D = ls.get(K.cache);   // last server snapshot (renders instantly on open)
let Q = ls.get(K.q, []);    // offline outbox: [{type:'add', body} | {type:'del', id}]
const UI = { tab: 'home', sheet: null, syncing: false, online: navigator.onLine, landTab: 'join', imp: null };
const token = () => ls.get(K.token);

async function server(method, path, body) {
  if (DEMO) return demoServer(method, path, body);
  let r;
  try {
    r = await fetch(path, { method, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (token() || '') }, body: body ? JSON.stringify(body) : undefined });
  } catch { const x = new Error("You're offline"); x.offline = true; throw x; }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const x = new Error(d.error || 'Something went wrong. Try again.'); x.status = r.status; x.offline = r.status >= 500; throw x; }
  return d;
}
let refreshing = null;
function refresh() {
  if (!DEMO && !token()) { D = null; render(); return Promise.resolve(); }
  return refreshing ||= (async () => {
    try { D = await server('GET', '/api/me'); ls.set(K.cache, D); UI.online = true; }
    catch (e) {
      if (e.status === 401) { signOut(); toast('Signed out. Ask your admin for a new login link.'); }
      else if (e.offline) UI.online = false;
    }
    refreshing = null; render();
  })();
}
// Online-only actions (settings, guests, admin). Everyday entries go through the outbox instead.
async function act(method, path, body, okMsg) {
  try { const r = await server(method, path, body); if (okMsg) toast(okMsg); await refresh(); return r; }
  catch (e) { toast(e.offline ? "You're offline. Try again when you're back online." : e.message); throw e; }
}
// Outbox: show instantly, sync in order, retry when back online. The cid makes retries safe.
function enqueue(op) { Q.push(op); ls.set(K.q, Q); render(); flush(); }
async function flush() {
  if (UI.syncing || !Q.length) return;
  UI.syncing = true; render();
  let synced = false;
  while (Q.length) {
    const op = Q[0];
    try {
      if (op.type === 'add') await server('POST', '/api/expenses', op.body);
      else if (op.type === 'del') await server('DELETE', '/api/expenses/' + op.id);
      UI.online = true;
    } catch (e) {
      if (e.offline) { UI.online = false; break; }
      toast((op.body?.description || 'Entry') + ': ' + e.message);
    }
    Q.shift(); ls.set(K.q, Q); synced = true;
  }
  UI.syncing = false;
  if (synced) await refresh(); else render();
}
// Server snapshot + queued changes = what the user sees.
function view() {
  if (!D || !D.members) return D;
  const v = { ...D, expenses: [...D.expenses] };
  for (const op of Q) {
    if (op.type === 'add') {
      const b = op.body, amount = toPaise(b.amount);
      v.expenses.push({ id: 'tmp_' + b.cid, kind: b.kind || 'expense', description: b.description || (b.kind === 'settle' ? 'Settle up' : 'Expense'),
        amount, paid_by: b.paidBy, split: equalShares(amount, b.split), created_by: D.me.id, created_at: b.at, pending: true });
    } else if (op.type === 'del') v.expenses = v.expenses.filter(e => e.id !== op.id);
  }
  v.expenses.sort((a, b) => b.created_at - a.created_at);
  return v;
}
window.addEventListener('online', () => { UI.online = true; flush(); refresh(); });
window.addEventListener('offline', () => { UI.online = false; render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { flush(); refresh(); } });
setInterval(() => { if (document.visibilityState === 'visible') { flush(); refresh(); } }, DEMO ? 60000 : 30000);
function signOut() { ls.set(K.token, null); ls.set(K.cache, null); ls.set(K.q, null); D = null; Q = []; UI.sheet = null; $layer.innerHTML = ''; render(); }

// ---------- SELECTORS ----------
const counted = v => v.members.filter(m => m.status === 'approved' || m.status === 'placeholder'); // everyone with a balance
const residents = v => counted(v).filter(m => m.role !== 'guest');
const isGuest = m => m?.role === 'guest';
const activeGuest = m => isGuest(m) && (!m.expires_at || m.expires_at > Date.now());
const amGuest = v => isGuest(v.me);
const names = v => Object.fromEntries(v.members.map(m => [m.id, m.id === v.me.id ? 'You' : m.name]));
const nets = v => netBalances(v.expenses);
const planOf = (v, simplify = !!v.flat.simplify) => settlePlan(counted(v), v.expenses, simplify)
  .filter(s => !amGuest(v) || s.from === v.me.id || s.to === v.me.id);
const asYou = (v, list) => list.map(m => ({ ...m, name: m.id === v.me.id ? 'You' : m.name }));
const hostId = v => v.me.host_id && v.members.some(m => m.id === v.me.host_id) ? v.me.host_id : null;
// Who can be picked in the add / settle sheets. Guests appear after flatmates, off by default.
function pickers(v) {
  if (amGuest(v)) return { main: asYou(v, [v.me, ...residents(v)]), extra: [] };
  const net = nets(v);
  return { main: asYou(v, residents(v)), extra: counted(v).filter(m => isGuest(m) && (activeGuest(m) || Math.abs(net[m.id] || 0) >= 100)) };
}
// Most-used descriptions first, so common entries are one tap.
function frequent(v) {
  const count = {};
  for (const e of v.expenses.slice(0, 300)) {
    if (e.kind !== 'expense' || e.source === 'auto') continue;
    const d = e.description.replace(/\s*·.*$/, '').trim();
    if (!d || d.length > 18) continue;
    const k = d.toLowerCase(); (count[k] ||= [d, 0])[1]++;
  }
  const out = [], seen = new Set();
  for (const d of [...Object.values(count).sort((a, b) => b[1] - a[1]).map(x => x[0]), ...QUICK]) {
    if (!seen.has(d.toLowerCase())) { seen.add(d.toLowerCase()); out.push(d); }
  }
  return out.slice(0, 10);
}

// ---------- SCREENS ----------
const $app = document.getElementById('app'), $layer = document.getElementById('layer');
function render() {
  const v = view();
  if (!DEMO && !token()) { $app.innerHTML = landing(); renderSheet(); return; }
  if (!v) { $app.innerHTML = `<div class="wrap"><div class="empty" style="padding-top:40vh"><span class="spin" aria-label="Loading"></span></div></div>`; renderSheet(); return; }

let toastT;
function toast(msg) { clearTimeout(toastT); document.querySelector('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); toastT = setTimeout(() => t.remove(), 2800); }
// In-app confirm (browser confirm() is blocked in some in-app browsers and embeds).
function ask(text, okLabel = 'Confirm', danger = false) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'ask';
    d.innerHTML = `<div class="sheet" role="alertdialog" aria-modal="true"><div class="grab"></div><h3 style="font-size:18px;margin-bottom:16px">${esc(text)}</h3>
      <div class="btns" style="flex-wrap:nowrap"><button class="btn ghost block" data-r="0">Cancel</button><button class="btn block${danger ? ' danger' : ''}" data-r="1">${esc(okLabel)}</button></div></div>`;
    d.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('[data-r]'); if (b || e.target === d) { d.remove(); res(b?.dataset.r === '1'); } });
    document.body.appendChild(d); d.querySelector('[data-r="1"]').focus();
  });
}
async function copy(text, msg = 'Copied') {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch {} t.remove(); toast(ok ? msg : 'Copy this: ' + text); }
}
async function downloadBackup(label = 'backup') {
  const snap = await server('GET', '/api/backup');
  if (FORCE_DEMO) { toast('Downloads are off in this preview. They work in the real app.'); return snap; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(snap, null, 1)], { type: 'application/json' }));
  a.download = `its-settled-${label}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  return snap;
}
async function doRestore(payload) {

  try { await downloadBackup('before-restore'); } catch { if (!await ask("Couldn't save your current data first. Restore anyway?", 'Restore anyway', true)) return; }
  const r = await act('POST', '/api/restore', payload).catch(() => null);
  if (r) { close(); UI.tab = 'home'; render(); toast(`Restored ${r.expenses} entries and ${r.recurring} monthly bills`); }
}

  if (method === 'GET' && path === '/api/me') {
    save();
    if (guest) return JSON.parse(JSON.stringify({ me: meOut, flat: { name: S.flat.name, simplify: 0, host: S.members.find(x => x.id === me.host_id)?.name },
      members: S.members.filter(x => x.status !== 'pending' && (!isGuest(x) || x.id === me.id)), expenses: S.expenses.filter(e => involves(e, me.id)), recurring: [], bot: null }));
    return JSON.parse(JSON.stringify({ me: meOut, flat: S.flat, members: S.members, expenses: S.expenses, recurring: S.recurring, bot: null, backup: admin ? { sheet: false, last: null } : null }));
  }
  if (method === 'POST' && path === '/api/demo/view') { S.viewAs = body.id || 'm1'; save(); return { ok: true }; }
  if (method === 'POST' && path === '/api/expenses') {
    if (body.cid && S.expenses.some(e => e.cid === body.cid)) return { ok: true, duplicate: true };
    const amount = toPaise(body.amount), ids = (body.split || []).filter(id => valid.has(id)), paidBy = valid.has(body.paidBy) ? body.paidBy : me.id;
    if (!amount || !ids.length) fail('Enter an amount and pick people');
    if (guest && paidBy !== me.id && !ids.includes(me.id)) fail('As a guest, you can only add entries you are part of');
    S.expenses.unshift({ id: 'e' + uid(), cid: body.cid, kind: body.kind === 'settle' ? 'settle' : 'expense', description: body.description || (body.kind === 'settle' ? 'Settle up' : 'Expense'),
      amount, paid_by: paidBy, split: equalShares(amount, ids), created_by: me.id, source: 'web', created_at: body.at || Date.now() });
    S.expenses.sort((a, b) => b.created_at - a.created_at); save(); return { ok: true };
  }
  if (method === 'DELETE' && (m = path.match(/^\/api\/expenses\/(.+)$/))) {
    const e = S.expenses.find(x => x.id === m[1]);
    if (e && e.created_by !== me.id && !admin) fail('Only whoever added this, or the admin, can delete it');
    S.expenses = S.expenses.filter(x => x.id !== m[1]); save(); return { ok: true };
  }
  if (guest) fail('Guests can only add and settle their own entries');
  if (method === 'POST' && path === '/api/recurring') {
    const amount = toPaise(body.amount), dd = Math.round(+body.day);
    if (!amount || !body.description || !(dd >= 1 && dd <= 31)) fail('Enter a name, an amount and a day between 1 and 31');
    const ids = (body.split || []).filter(id => res.includes(id));
    S.recurring.push({ id: 'r' + uid(), description: body.description.trim(), amount, paid_by: body.paidBy || me.id, split: ids.length && ids.length < res.length ? JSON.stringify(ids) : null, day: dd });
    S.recurring.sort((a, b) => a.day - b.day);
    if (body.addNow) S.expenses.unshift({ id: 'e' + uid(), kind: 'expense', description: body.description.trim(), amount, paid_by: body.paidBy || me.id,
      split: equalShares(amount, ids.length ? ids : res), created_by: me.id, source: 'auto', created_at: Date.now() });
    save(); return { ok: true };
  }
  if (method === 'DELETE' && (m = path.match(/^\/api\/recurring\/(.+)$/))) { S.recurring = S.recurring.filter(r => r.id !== m[1]); save(); return { ok: true }; }
  if (method === 'POST' && path === '/api/guests') {
    const id = 'g' + uid().slice(0, 8); S.members.push({ id, name: String(body.name).trim().slice(0, 30), role: 'guest', status: 'approved', tg: 0, host_id: me.id, expires_at: body.until || null, created_at: Date.now() });
    save(); return { id, token: 'demo-guest-' + id };
  }
  if (method === 'POST' && (m = path.match(/^\/api\/guests\/(\w+)$/))) {
    const g = S.members.find(x => x.id === m[1]); if (!g) fail('Guest not found');
    g.expires_at = body.until === 'now' ? Date.now() : body.until; save(); return { ok: true };
  }
  if (method === 'POST' && path === '/api/flat') { if (!admin) fail('Only the admin can change flat settings'); S.flat.simplify = body.simplify ? 1 : 0; save(); return { ok: true }; }
  if (method === 'POST' && (m = path.match(/^\/api\/members\/(\w+)\/(approve|reject|relogin)$/))) {
    const t = S.members.find(x => x.id === m[1]); if (!t) fail('Member not found');
    if (m[2] === 'relogin') return { token: 'demo-login-' + t.id };
    if (m[2] === 'reject') { S.members = S.members.filter(x => x !== t); save(); return { ok: true }; }
    const ph = body.as && S.members.find(x => x.id === body.as && x.status === 'placeholder');
    if (ph) { ph.status = 'approved'; S.members = S.members.filter(x => x !== t); save(); return { ok: true, linked: ph.name }; }
    t.status = 'approved'; save(); return { ok: true };
  }
  if (method === 'POST' && path === '/api/import') {
    const map = {};
    for (const [n, tgt] of Object.entries(body.people)) {
      if (tgt === 'new') { const id = 'p' + uid().slice(0, 8); S.members.push({ id, name: n, role: 'member', status: 'placeholder', tg: 0, created_at: Date.now() }); map[n] = id; }
      else map[n] = tgt;
    }
    const seen = new Set(S.expenses.map(e => e.ext_id).filter(Boolean)); let added = 0, dup = 0;
    for (const r of body.rows) {
      if (seen.has(r.key)) { dup++; continue; }
      S.expenses.push({ id: 'e' + uid(), ext_id: r.key, kind: r.kind, description: r.description, amount: r.amount, paid_by: map[r.payer],
        split: r.shares.map(([n, a]) => [map[n], a]), created_by: me.id, source: 'import', created_at: r.date }); added++;
    }
    S.expenses.sort((a, b) => b.created_at - a.created_at); save(); return { added, duplicates: dup, skipped: 0 };
  }
  if (method === 'GET' && path === '/api/backup')
    return { app: 'its-settled', version: 1, exported_at: new Date().toISOString(), flat: S.flat, members: S.members.filter(x => x.status !== 'pending'),
      expenses: S.expenses, recurring: S.recurring.map(r => ({ ...r, split: r.split ? JSON.parse(r.split) : null })) };
  if (method === 'POST' && path === '/api/restore') {
    if (body.from === 'sheet') fail('Google Sheet backup is not available in the demo');
    const snap = body.snapshot, idMap = {};
    for (const p of snap.members) {
      const hit = S.members.find(c => c.status !== 'pending' && (c.id === p.id || c.name.toLowerCase() === p.name.toLowerCase()));
      if (hit) idMap[p.id] = hit.id;
      else { idMap[p.id] = 'p' + uid().slice(0, 8); S.members.push({ id: idMap[p.id], name: p.name, role: p.role === 'guest' ? 'guest' : 'member', status: 'placeholder', tg: 0, created_at: Date.now() }); }
    }
    S.expenses = snap.expenses.map(e => ({ ...e, id: 'e' + uid(), paid_by: idMap[e.paid_by], split: e.split.map(([id, a]) => [idMap[id], a]) })).sort((a, b) => b.created_at - a.created_at);
    S.recurring = (snap.recurring || []).map(r => ({ ...r, id: 'r' + uid(), paid_by: idMap[r.paid_by], split: r.split ? JSON.stringify(r.split.map(id => idMap[id])) : null }));
    save(); return { ok: true, expenses: S.expenses.length, recurring: S.recurring.length };
  }
  fail('Not available in the demo');
}

// ---------- BOOT ----------
(function boot() {
  const th = ls.get('is_theme'); if (th) document.documentElement.dataset.theme = th;
  const h = location.hash.match(/^#login=(\w{20,})/);
  if (h && !DEMO) { ls.set(K.token, h[1]); ls.set(K.cache, null); D = null; history.replaceState(null, '', '/'); }
  render();                    // instant, from cache
  refresh().then(flush);       // then sync quietly
  setInterval(() => { if (D?.me?.status === 'pending') refresh(); }, 6000);
  if ('serviceWorker' in navigator && !FORCE_DEMO) navigator.serviceWorker.register('/sw.js').catch(() => {});
})();
</script>
</body>
